# Streetscape Tracker scheduler configuration.
#
# This example is checked into git; the production copy on makelab1 can
# diverge (pass --config to point at it, or edit this file in place there).
# Parsed with stdlib tomllib (Python 3.11+).

[schedule]
# Each city is re-collected roughly every cycle_days; grace_days lets a city
# run slightly early so the stagger stays smooth.
cycle_days = 90
grace_days = 7

# max_cities_per_day counts cities, not runs — a city due for both
# providers runs both back-to-back with the same run date. This is the NIGHTLY
# cap; `run-due --limit N` (N >= 1) overrides it for one invocation, which is how
# an on-demand single-channel catch-up gets past it (issue #214). At 20 a full
# pass over the 1,214 enabled cities is ~61 nights; the Mapillary daily budget
# would allow ~5, which is the gap --limit exists to close.
max_cities_per_day = 20

# A (city, provider) pair is skipped after this many consecutive failures
# until re-enabled.
max_consecutive_failures = 5
# Floor for the per-city subprocess timeout. For GSV the effective timeout is
# derived from the grid's estimated request count and max_requests_per_minute
# (with headroom), so large cities are not SIGKILLed mid-run; this floor still
# applies to small cities and to the fast Mapillary provider.
city_timeout_minutes = 180

# Wall-clock ceiling on the city loop. Once this much of the night has elapsed,
# run-due stops STARTING new cities (the one in flight is also capped to what is
# left) and goes straight to regenerating the aggregate + streetwalk manifest
# and publishing. Cities not reached simply stay due and lead tomorrow's
# stalest-first queue.
#
# This exists because the tail is what makes a night VISIBLE. run-due is a
# oneshot systemd unit under TimeoutStartSec, and before this a batch that
# overran was SIGKILLed mid-loop — every city it had already collected sat in
# the catalog, correct but unpublished, until an operator noticed and ran
# regenerate-aggregate by hand (issue #167). Keep it comfortably under the
# unit's TimeoutStartSec so this deadline, not systemd, ends a long night.
max_batch_hours = 10

# Legacy fallback: when no [providers.*] sections exist below, this is the
# GSV daily budget and only GSV is collected.
daily_request_budget = 10000000

# Per-provider daily request budgets. Each provider keeps its own run
# series, budget ledger, and failure tracking; both are collected for a
# city on the same day so cross-provider snapshots align.
[providers.gsv]
enabled = true
# Daily ceiling on GSV metadata API requests across all cities. This is a
# nightly-runtime knob, NOT a cost/quota limit: metadata requests are free
# of charge (developers.google.com/maps/documentation/streetview/metadata);
# the hard limit is the project's queries/minute quota (default 30,000),
# enforced client-side by [download].max_requests_per_minute below — a fast
# host can otherwise exceed the quota (makelab1 sustained ~470 req/s
# unpaced on 2026-07-16 and got throttled).
# Cycling ~1,144 cities every 90 days needs ~6.7M/day (median city ~54k pts,
# not the ~15-25k first assumed). 10M/day covers that with headroom and runs
# ~9 h on a full-budget night; only ~5 giant cities (Juneau, Anchorage, …)
# exceed it and are collected manually. Raise for faster cycling; the
# per-minute pacing (not this number) is the real ceiling.
daily_request_budget = 10000000

[providers.mapillary]
enabled = true
# Counted in z14 vector-tile requests (each tile carries every image's
# metadata for a ~2 km square — a city is typically 10-100 tiles).
#
# WHAT MAPILLARY DOCUMENTS for this endpoint (read it before touching either
# this number or the rate below — see the top-of-file rule in CLAUDE.md):
#   tiles.mapillary.com          50,000 per day, "(not per minute)", per app
#                                 exceeding it -> status code 4xx
#   graph.mapillary.com/:id      60,000 per minute per app
#   graph.mapillary.com/images   10,000 per minute per app
# So the tile CDN has NO documented throughput limit at all; per-minute limits
# are a Graph API property. (Mapillary's own numbers are not self-consistent: a
# staff reply on forum.mapillary.com/t/hitting-request-limit/5820 gives graph as
# 50,000/min, against the 60,000 + 10,000 on the docs page.)
#
# WHAT ACTUALLY HAPPENED matched none of that. On 2026-08-12 the host's whole IP
# was redirected 302 to a login page for every tile — across BOTH Mapillary
# applications at once — at a day's spend of 10,659 requests (~21% of the
# documented daily cap) sustained at ~370 requests/min. Wrong scope (IP, not
# app), wrong threshold, wrong status (302, not 4xx). It happened AGAIN on
# 2026-08-20 — this time while obeying 60/min exactly, at a day's spend of
# 5,013 (issue #241). The mechanism that hit us is undocumented in every
# respect, so neither number below is derived from the docs; they are bets.
#
# THE BET (issue #214), AND HOW IT RESOLVED (issue #241): we bet that the
# trigger was throughput, not daily volume — that max_requests_per_minute
# below was the real protection and this budget a loose backstop. That bet
# LOST on 2026-08-20: a second block arrived while the limiter held 60/min
# exactly, at a day's spend of 5,013, one day after 5,753 ran clean. So a
# calendar-day cap is arithmetically impossible (no threshold is both
# <= 5,013 and > 5,753), and a pinned peak rate cannot be the discriminator
# (it is constant across blocked and clean days). Testing every window
# against the api_usage ledger, only a rolling 2-3 DAY accumulation admits
# any threshold separating both blocks from every clean day: 2-day in
# (7,061, 10,766], 3-day in (10,284, 12,074] — and the 2-day bound sits
# within 1% of the 10,659 single-day spend that caused the first block,
# consistent with an undocumented per-IP budget of roughly 10,000 per ~48 h.
# Equally good rival at n=2: a repeat-offender penalty (the IP carries a
# lowered threshold after a prior block). Separating them costs a block if
# the experiment works, so it is deliberately not being run. Full analysis,
# both incidents' numbers, and the staff statements: issue #241.
#
# THE NUMBERS BELOW (cut 2026-08-22: 15,000 + 5,000 -> 1,750 + 1,750): the
# block is per IP, so what is on the line is the SUM — 3,500/day on one
# address, chosen so any 2-day total stays <= 7,000, at or below the highest
# value ever observed clean (7,061). Split EVENLY because both channels read
# the identical z14 census (a road walk re-reads the grid run's tiles), so
# the two budgets deplete in lockstep and a heavy slate defers the same
# cities on both channels instead of un-pairing them. A normal 20-city night
# (~1,150 tiles per channel) is unaffected. NO `--limit` catch-ups
# until a rolling multi-day guard exists: these budgets bound any single day,
# but three consecutive maxed days sum to 10,500 — inside the 3-day
# uncertainty band above — so only a multi-night catch-up can reach where
# normal nights cannot.
#
# RECOVERY, measured twice (#241): the block lifts within ~a day of the LAST
# refused request — block 1 cleared after ~20.5 h of true silence (silence
# only began ~44 h in; a ~48 h probe was still refused; ~48-65 h total),
# block 2 within
# <= 24 h 32 min of silence from onset, matching staff's "the block is 24
# hours, as I remember". On a block: disable both channels immediately,
# ps-sweep for detached loops, then ONE single-request probe per application
# daily from ~24 h.
#
# Sizing, measured over the 1,214 enabled cities on 2026-08-16: the largest
# frozen grid is 870 tiles (Moscow), so no city is ever skipped as "exceeds
# the entire daily budget"; the mean is 57.8, so 1,750 reaches ~30 cities and
# the 70,168-tile catalog is one full pass in ~40 nights. The budget — not
# max_batch_hours — is now what ends a maxed Mapillary night.
daily_request_budget = 1750
# Client-side pacing for the tile CDN (issue #198). 60/min is a conservative
# guess; 370 is confirmed too high — and #241 proved 60/min is NOT sufficient
# on its own (blocked 2026-08-20 while obeying it exactly). The limiter stays
# because an unpaced burst is confirmed harmful and a constant peak rate is
# what made the two incidents comparable; the operative constraint is the
# multi-day window above. Shared per IP with
# [providers.mapillary_streets] below and with any manual collection on this
# host — the cross-process host lock (issue #208) is what makes this figure the
# real one rather than a per-process wish. A ban is not cheap: it takes out
# every Mapillary channel on the host until it lifts.
max_requests_per_minute = 60

# Road-walk street-coverage collection (issue #99). These are SCHEDULED
# channels like the two above — same cycle_days, same stagger day (a city's
# grid and street collections land on the same night, so their snapshots
# pair), same failure counting — but `run-due` runs the road-walk collector
# (`python -m streetscape_street_analyzer.collect`) for them instead of
# streetscape_tracker.py, against ISOLATED credentials and ledgers so a road
# crawl can never exhaust the grid collectors' quota.
#
# GSV: one metadata request per on-street sample point. Cycling the full
# catalog at 15 m spacing is on the order of 1.5M requests/night averaged over a
# 90-day cycle (Seattle alone is ~247k, Berlin ~850k), so the ceiling below is a
# nightly runtime knob, not a cost limit — metadata requests are free of charge.
# It is set at ~2x the average because nightly demand is lumpy: a few large
# cities landing together would otherwise exhaust it and defer the rest, which
# is graceful but stalls the first pass through the catalog. The real limit is
# the streets key's own per-minute quota (a fresh key resets to Google's default
# ~30,000/min), paced client-side at ~80% below.
[providers.gsv_streets]
enabled = true
daily_request_budget = 3000000
max_requests_per_minute = 24000
# Along-edge sample spacing in metres. 15 m is the validated default (a
# match-distance sweep moved coverage by ~1 pp); raising it cuts requests
# proportionally, at the cost of coarser per-edge fractions.
spacing_m = 15
# Which OSM network to walk. 'drive' is osmnx's motorized-public-roads filter,
# which excludes footways, paths, pedestrian streets, cycleways, steps, tracks
# and every highway=service way (alleys included). 'all_public' is a strict
# superset that adds all of them — a substantially larger network (budget for
# roughly 2.5x the samples on a first walk) and therefore a much longer night.
#
# Each network type is its OWN walk series: separate artifacts (a network token
# in the filename, 'drive' tokenless), separate street_walks rows, separate
# cadence. Changing this does NOT continue the existing series — it starts a new
# one, and coverage_pct_by_length means something different in it (a much larger
# street-km denominator). Leave it on 'drive' unless you mean to do that.
#network_type = "drive"

# Mapillary road-walk. Costs the z14 tile census — set by the frozen bbox's area
# (catalog median 12 tiles, mean 58, max 870) and independent of sample SPACING,
# though not of city size — because Mapillary has no per-point metadata endpoint;
# the walk is a local spatial join against the tiles. Budgeted in tile requests against the same PER-IP ceiling as the grid
# channel above (see its comment for the documented limits and how the #214
# bet resolved), not against the per-app cap: different tokens, one address,
# so the number that matters is the SUM — 1,750 + 1,750 = 3,500/day as of
# 2026-08-22 (issue #241), split evenly: a road walk reads the identical
# tile census as the grid run, so a paired night costs the same on each
# channel and the budgets deplete in lockstep.
[providers.mapillary_streets]
enabled = true
daily_request_budget = 1750
spacing_m = 15
# See [providers.mapillary].max_requests_per_minute. The tile CDN's rate limit
# is per IP, so this channel and the grid one draw on ONE budget no matter that
# they hold separate tokens — the scheduler runs them sequentially, which is
# what keeps the combined rate at this figure rather than double it.
max_requests_per_minute = 60
# See [providers.gsv_streets].network_type. A broader network costs Mapillary
# nothing extra (the tile census is the same regardless of how many sample
# points are scored against it) — only the local join gets bigger.
#network_type = "drive"

[download]
# Conservative defaults; see cli.py docstring for tuning guidance.
batch_size = 100
connection_limit = 50
request_timeout_s = 30.0
# Client-side cap on gsv metadata requests/minute, applied per city run.
# Keep this at ~80% of the project's granted per-minute quota (default
# quota 30,000 -> 24000 here); server-side throttling (OVER_QUERY_LIMIT)
# burns retries and can abort a run. 0 disables pacing.
max_requests_per_minute = 24000
# Pause between cities to spread load.
sleep_between_cities_s = 60

[paths]
# Absolute paths recommended for the systemd deployment. Defaults (when
# omitted) are relative to the repo: ./data, ./data/streetscape_tracker.db,
# ./logs, ./backups
#data_dir = "/homes/gws/jonf/streetscape-tracker/data"
#db_path  = "/homes/gws/jonf/streetscape-tracker/data/streetscape_tracker.db"
#log_dir  = "/homes/gws/jonf/streetscape-tracker/logs"
# Dated, integrity-verified catalog backups (issue #145), retained 14 days.
# Must stay OUTSIDE data_dir — the publish rsync walks data/ and would ship
# catalog backups to the public web server — and INSIDE whatever path CSE IT
# snapshots, since the ZFS snapshot history of these files is what provides
# point-in-time recovery. Check health with: scheduler backup-status
#backup_dir = "/homes/gws/jonf/streetscape-tracker/backups"

[publish]
# When true, run the publish script after each successful daily batch.
enabled = false
#publish_script = "/homes/gws/jonf/streetscape-tracker/sync_data_to_server.sh"
# Set on a host that NFS-mounts the public docroot: publishing becomes a local
# rsync (`--local`) instead of an SSH hop. Prefer this over exporting
# STREETSCAPE_PUBLISH_LOCAL, so a hand-run publish behaves the same as the
# nightly one — see issue #215 and the note in scheduler.makelab1.toml.
#local = true
# Public base URL of the site; only used to print operator-facing links
# (assess-city's city page). Relative links are printed when unset. A trailing
# slash is added if you omit one.
#site_url = "https://makeabilitylab.cs.washington.edu/public/streetscape-tracker/"

[alerts]
# Email the operator when a nightly run finishes unhealthy (>= failure_threshold
# failed collections) or crashes. OFF until enabled + a recipient are set;
# nothing is ever sent otherwise. Independent of (and complementary to) the
# optional systemd OnFailure= hook — see deploy/README.md.
enabled = false
#recipient = "jonf@cs.uw.edu"
# Transport: "smtp" (stdlib smtplib straight to a relay — the sandbox-safe
# choice, see below), "mail" (uses a local relay), "msmtp"/"sendmail" (SMTP),
# or "command" (an arbitrary shell command; body on stdin, subject/recipient in
# $STREETSCAPE_ALERT_SUBJECT/$STREETSCAPE_ALERT_TO — e.g. a Slack webhook curl). Confirm which
# works on the box first:  echo test | mail -s test jonf@cs.uw.edu
transport = "mail"
#command = ""
# --- transport = "smtp" settings (issue #144) ---
# Prefer this under systemd: it never touches the local setgid mailer, so a
# hardened unit (NoNewPrivileges / ProtectSystem=strict) can't break the send.
# smtp_host is the only required field; the rest are opt-in for the relay.
#smtp_host = "smtp.cs.washington.edu"   # UW CSE relay: no-auth for on-campus hosts
#smtp_port = 25                          # 587 for a submission port
# smtp_from defaults to streetscape-tracker@<hostname>, but many relays (incl.
# smtp.cs.washington.edu) reject a non-deliverable sender with "550 Address
# unknown" — set a real mailbox there.
#smtp_from = "you@cs.washington.edu"
#smtp_starttls = false                   # true on a submission/TLS port
#smtp_user = ""                          # set with a password to authenticate
# Password for smtp_user. Prefer the env var over the toml so no secret is
# committed: STREETSCAPE_ALERT_SMTP_PASSWORD (env wins if both are set).
#smtp_password = ""
# Alert when at least this many (city, provider) collections failed. Raise it
# to avoid paging on the occasional flaky single city.
failure_threshold = 1
#subject_prefix = "[streetscape-tracker]"

[resource_guard]
# Be a good tenant on a shared host: before each city, check load + free RAM
# and lower this run's own concurrency (--connection-limit) when the box is
# already busy. Best-effort and Linux-only (reads /proc); a no-op elsewhere.
# The systemd unit's CPU/RAM caps are the static floor; this is the dynamic
# courtesy on top. Set enabled = false to disable.
enabled = true
# Throttle to min_connection_limit when MemAvailable drops below this.
min_available_memory_gb = 8.0
# Throttle when the 5-minute load average exceeds this * CPU count.
max_load_per_core = 0.9
# Never throttle concurrency below this floor.
min_connection_limit = 5

[driving_plan]
# Nightly snapshot of Google's published Street View driving-plan feed
# (issue #176): a single mutable URL Google overwrites in place, so revisions
# are lost to anyone not archiving. One unauthenticated request per night —
# no API key, no provider budget — run by run-due before the city loop (so it
# happens even on zero-due nights and can't be eaten by the batch deadline).
# A snapshot catalog row is written every fetch; the gzipped artifact and the
# per-district DB entries only when the feed content actually changed.
enabled = true
# Artifacts live OUTSIDE data/ on purpose: data/ is rsynced to the public web
# server and its whitelist publishes every *.json.gz — archiving there would
# republish Google's content.
#archive_dir = "archive/gsv_driving_plan"   # default: <repo>/archive/gsv_driving_plan
#url = "https://www.google.com/streetview/static/feed/driving/data.json"
#timeout_s = 60.0
