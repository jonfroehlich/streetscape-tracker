# Streetscape Tracker scheduler configuration — makelab1 production deploy.
#
# This is the checked-in production config the systemd unit points at
# (--config .../scheduler.makelab1.toml). See config/scheduler.toml for the
# fully-annotated example; comments here are trimmed to what's deploy-specific.
# Parsed with stdlib tomllib (Python 3.11+).

[schedule]
cycle_days = 90            # re-collect each city ~quarterly
grace_days = 7
# Nightly cap; `run-due --limit N` (N >= 1) overrides it for one invocation
# (issue #214). At 20, a full pass over the enabled cities is ~61 nights.
max_cities_per_day = 20    # cities/day (a city runs all enabled providers)
max_consecutive_failures = 5
city_timeout_minutes = 180
# Stop STARTING cities after this many hours so the aggregate/manifest/publish
# tail still runs. Must stay below the unit's TimeoutStartSec (14h) — before
# this existed, a 12h systemd kill discarded a whole night's publish (#167).
max_batch_hours = 10
daily_request_budget = 10000000   # legacy fallback; superseded by [providers.*]

# Per-provider daily request budgets (own run series, ledger, failure tracking).
[providers.gsv]
enabled = true
# GSV metadata is free; the real ceiling is the per-minute rate cap (see [download]).
# 10M/day covers cycling ~1,144 cities on the 90-day schedule with headroom.
daily_request_budget = 10000000

[providers.mapillary]
enabled = true
# Counted in z14 vector-tile requests. Mapillary documents this endpoint as
# "50,000 per day (not per minute)" per app — i.e. NO documented throughput
# limit at all — and 4xx on exceeding it. Our block matched none of that: on
# 2026-08-12 makelab2's whole IP was redirected 302 to a login page for every
# tile, across BOTH applications, at a day's spend of 10,659 (~21% of the
# documented cap) sustained at ~370 req/min. Wrong scope, wrong threshold, wrong
# status — so the mechanism that hit us is undocumented in every respect.
#
# We deliberately bet on the THROUGHPUT reading (issue #214): the forum's
# reported ~15-minute cooldown fits a burst throttle better than a daily volume
# cap, which would reset at a day boundary. But our OWN measurement cuts the
# other way — the 2026-08-12 block refused this host for ~20.5 h, which by that
# same reset-interval criterion is the day-scale answer — so this is a considered
# bet against our one daily datapoint, not an inference from it. See
# config/scheduler.toml's comment on this key for the full reasoning.
#
# NOT A RAISE: 40,000 -> 15,000 lowers the combined per-IP ceiling from 45,000 to
# 20,000, and 40,000 was never reachable. At 60/min with max_batch_hours = 10 and
# sleep_between_cities_s = 60, a night tops out near ~300 cities / ~17,000 tiles,
# so 15,000 is roughly as much as a night can actually spend. Full pass over the
# 70,168-tile catalog: ~5 nights (vs ~61 at the 20-city nightly cap, which is
# what `--limit N` exists to override).
#
# BE HONEST ABOUT WHAT THIS IS: 15,000 + mapillary_streets' 5,000 = 20,000/day
# on one IP, ~1.9x the only daily figure we have ever measured going badly. If
# the trigger turns out to be volume after all, this is the line that caused it.
# Also watch the third axis: a budget-sized catch-up is ~4 h of UNINTERRUPTED
# fetching where the 2026-08-12 block took ~29 min at ~370/min, so if a block
# arrives on a night that never exceeded 60/min, record BOTH the day's api_usage
# AND how long the fetching ran before changing anything.
daily_request_budget = 15000
# Client-side tile pacing (issue #198). Shared per-IP with mapillary_streets
# below and with any manual run on this host — the host lock (#208) is what
# makes this figure the real one rather than a per-process wish.
max_requests_per_minute = 60

# Road-walk street-coverage collection (issue #99). SCHEDULED channels like the
# two above — same cycle, same stagger day (a city's grid and street snapshots
# pair), same failure counting — but `run-due` runs the road-walk collector for
# them instead of streetscape_tracker.py, against ISOLATED credentials and
# ledgers (GMAPS_STREETS_API_KEY / MAPILLARY_STREETS_ACCESS_TOKEN, metered under
# gsv_streets / mapillary_streets) so a road crawl can never exhaust the grid
# collectors' quota.
#
# GSV: one metadata request per on-street sample point, so the ceiling below is
# a nightly runtime knob rather than a cost limit (metadata is free). Paced by
# its own key's quota, NOT [download].max_requests_per_minute — the streets key
# is a fresh key at Google's ~30,000/min default, so 24,000 is ~80% headroom.
#
# Sizing: the whole frame is ~133M on-street samples at 15 m, so a full pass at
# 20 cities/night averages ~1.5M/night. The ceiling is 2x that because nightly
# demand is lumpy, not average — a single Berlin-scale city is ~850k, and three
# of them landing on one night would exhaust a tighter budget and defer the rest
# (graceful, but it stalls the first pass). The requests are free; only wall
# clock is spent, ~1 h/night at the pacing above.
[providers.gsv_streets]
enabled = true
daily_request_budget = 3000000
max_requests_per_minute = 24000
spacing_m = 15

# Mapillary road-walk: costs the z14 tile census (tens of requests for a whole
# city) regardless of city size or spacing, because Mapillary has no per-point
# endpoint — the walk is a local spatial join against the tiles. Budgeted in tile
# requests against the SAME per-IP ceiling as [providers.mapillary] above, not
# against the per-app cap: different tokens, one address, so the number that
# matters is the SUM (15,000 + 5,000 = 20,000/day). Kept as the smaller half
# because the grid census is the series we are actually catching up.
[providers.mapillary_streets]
enabled = true
daily_request_budget = 5000
spacing_m = 15
# See [providers.mapillary] — one per-IP rate budget, two channels.
max_requests_per_minute = 60

[download]
batch_size = 100
connection_limit = 50
request_timeout_s = 30.0
sleep_between_cities_s = 60
# Client-side GSV metadata rate cap. Google approved 60,000 req/min for this
# project (2026-07-16); we pace at 80% to stay clear of the quota alert and
# never write OVER_QUERY_LIMIT rows. Repo default is a conservative 24,000.
max_requests_per_minute = 48000

[paths]
# The checkout + data live on lab storage, NFS-mounted on the compute host.
# ~/streetscape-tracker is a convenience symlink to this path (see deploy/README.md).
data_dir = "/projects/makeabilitylab/streetscape-tracker/data"
db_path  = "/projects/makeabilitylab/streetscape-tracker/data/streetscape_tracker.db"
log_dir  = "/projects/makeabilitylab/streetscape-tracker/logs"
# Dated catalog backups (issue #145), retained 14 days. Stated explicitly like
# its neighbours rather than left to the default: the default resolves off the
# package location, which under the systemd unit reaches this same directory
# only by way of the ~/streetscape-tracker symlink. OUTSIDE data_dir (the
# publish rsync walks data/ and would ship catalog copies to the public web
# server) and INSIDE the tree CSE IT snapshots. Health: scheduler backup-status
backup_dir = "/projects/makeabilitylab/streetscape-tracker/backups"

[publish]
# After each successful nightly batch, publish *.csv.gz/*.json.gz to the public
# docroot. STREETSCAPE_PUBLISH_LOCAL=1 (set in the systemd unit) makes this a LOCAL rsync
# into the NFS-mounted docroot — no SSH hop. The script excludes the DB/logs/bare
# CSVs, so only sanitized artifacts ever reach the web server.
enabled = true
publish_script = "/projects/makeabilitylab/streetscape-tracker/sync_data_to_server.sh"

[alerts]
# Email on an unhealthy night (>= failure_threshold failed collections) or crash.
# transport = "smtp" (not "mail"): the local mailer is silently BLOCKED under
# the systemd sandbox — its setgid postdrop path trips NoNewPrivileges, so the
# alert never sends even though the failure is detected (#144). The stdlib
# smtplib path talks to the campus relay directly and works in the sandbox.
enabled = true
recipient = "jonf@cs.uw.edu"
transport = "smtp"
# Campus relay: reachable from makelab2, unauthenticated for on-campus hosts,
# plain port 25 (verified 2026-07-17). smtp_from MUST be a real deliverable
# address — the relay rejects streetscape-tracker@<hostname> as "Address
# unknown", so alerts appear to come from jonf@ (Reply-To not needed).
smtp_host = "smtp.cs.washington.edu"
smtp_port = 25
smtp_from = "jonf@cs.washington.edu"
failure_threshold = 1
subject_prefix = "[streetscape-tracker]"

[resource_guard]
# makelab1 is shared with other lab services. Before each city, back off this
# run's concurrency if the box is already under pressure (48 cores / 187 GB, so
# the load ceiling is ~43). Complements the static CPU/RAM caps in the systemd
# unit. See config/scheduler.toml for field docs.
enabled = true
min_available_memory_gb = 8.0
max_load_per_core = 0.9
min_connection_limit = 5

[driving_plan]
# Nightly snapshot of Google's published driving-plan feed (issue #176).
# Matches the manual snapshot dir already on prod; outside data/ so the
# publish rsync never sees it. See config/scheduler.toml for field docs.
enabled = true
archive_dir = "/projects/makeabilitylab/streetscape-tracker/archive/gsv_driving_plan"
