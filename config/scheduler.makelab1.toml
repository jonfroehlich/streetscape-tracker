# Streetscape Tracker scheduler configuration — makelab1 production deploy.
#
# This is the checked-in production config the systemd unit points at
# (--config .../scheduler.makelab1.toml). See config/scheduler.toml for the
# fully-annotated example; comments here are trimmed to what's deploy-specific.
# Parsed with stdlib tomllib (Python 3.11+).

[schedule]
cycle_days = 90            # re-collect each city ~quarterly
grace_days = 7
# Nightly cap; `run-due --limit N` (N >= 1) overrides it for one invocation
# (issue #214). At 20, a full pass over the enabled cities is ~61 nights.
max_cities_per_day = 20    # cities/day (a city runs all enabled providers)
max_consecutive_failures = 5
city_timeout_minutes = 180
# Stop STARTING cities after this many hours so the aggregate/manifest/publish
# tail still runs. Must stay below the unit's TimeoutStartSec (14h) — before
# this existed, a 12h systemd kill discarded a whole night's publish (#167).
max_batch_hours = 10
# Channels of one city, in flight at once (issue #240). Explicit at 1 rather
# than inherited, because this is the file prod reads and the value is the whole
# rollout: 1 is today's sequential behaviour. Raising it is deploy-gated on two
# things that live outside this repo:
#   1. GMAPS_API_KEY and GMAPS_STREETS_API_KEY confirmed in SEPARATE Google
#      Cloud projects (they hold no per-IP lock, so a shared project would put
#      48k+24k req/min on one quota with nothing serializing them). Record the
#      project IDs and the date of the check here when it is done.
#   2. Issue #256 landed — resume for the Mapillary tile census. Until then a
#      killed child re-spends tiles against the 3,500/day per-IP ceiling.
# Go to 2 before 3: gsv is the long pole and already overlaps each short channel
# in turn at 2, for half the blast radius. See docs/scheduler.md.
max_concurrent_channels = 1
daily_request_budget = 10000000   # legacy fallback; superseded by [providers.*]

# Per-provider daily request budgets (own run series, ledger, failure tracking).
[providers.gsv]
enabled = true
# GSV metadata is free; the real ceiling is the per-minute rate cap (see [download]).
# 10M/day covers cycling ~1,144 cities on the 90-day schedule with headroom.
daily_request_budget = 10000000

# PAUSED 2026-08-28 after the THIRD per-IP block (see the new-issue link in
# docs/provider-access.md). Not a volume decision: the ledger rules out a fixed
# threshold over every window from 1 to 8 days — 08-28 was refused at 1,938/day
# while 08-14 spent 26,363 clean — so cutting the budget a third time has no
# mechanism to work through. The budgets below are LEFT AS-IS deliberately: they
# are the sizing #241/#267 argued for, and re-enabling should be a decision about
# the mechanism, not a re-derivation of numbers that were never the binding
# constraint.
#
# RESUMED 2026-08-30 under issue #292: slower mean rate AND jittered request
# gaps (see max_requests_per_minute / jitter below), with #291's shared census
# halving a paired night's tile spend. Deployed 2026-08-29 afternoon, so the
# first jittered night is the 08-30 02:13 timer fire -- ONE NIGHT EARLIER than
# the 08-31 this said when it was written, and the prediction below is shifted
# to match rather than left pointing at the pre-deploy plan.
#
# Pre-registered prediction, recorded in #286: each prior block landed ON the
# 6th active collection night (08-13..08-20, 08-23..08-28), so with 08-30 as
# night 1 a fourth block around 2026-09-04/05 means rate, volume and request
# pattern are ALL dead and the trigger is cadence (next move: rest days, not
# more pacing); clean through ~2026-09-09 means keep this. The prior blocks
# were ALSO 8 calendar days apart, but only because each run contained two
# paused days; this restart has none, so count active nights, not calendar
# days. If it blocks: disable both channels again, sweep for detached
# processes, probe once after ~24 h.
[providers.mapillary]
enabled = true
# Counted in z14 vector-tile requests. Mapillary documents this endpoint as
# "50,000 per day (not per minute)" per app — i.e. NO documented throughput
# limit at all — and 4xx on exceeding it. Our block matched none of that: on
# 2026-08-12 makelab2's whole IP was redirected 302 to a login page for every
# tile, across BOTH applications, at a day's spend of 10,659 (~21% of the
# documented cap) sustained at ~370 req/min. Wrong scope, wrong threshold, wrong
# status — so the mechanism that hit us is undocumented in every respect.
#
# We deliberately bet on the THROUGHPUT reading (issue #214): the forum's
# reported ~15-minute cooldown fits a burst throttle better than a daily volume
# cap, which would reset at a day boundary. But our OWN measurement cuts the
# other way — the 2026-08-12 block refused this host for ~20.5 h, which by that
# same reset-interval criterion is the day-scale answer — so this is a considered
# bet against our one daily datapoint, not an inference from it. See
# config/scheduler.toml's comment on this key for the full reasoning.
#
# NOT A RAISE: 40,000 -> 15,000 lowers the combined per-IP ceiling from 45,000 to
# 20,000, and 40,000 was never reachable. At 60/min with max_batch_hours = 10 and
# sleep_between_cities_s = 60, a night tops out near ~300 cities / ~17,000 tiles,
# so 15,000 is roughly as much as a night can actually spend. Full pass over the
# 70,168-tile catalog: ~5 nights (vs ~61 at the 20-city nightly cap, which is
# what `--limit N` exists to override).
#
# BE HONEST ABOUT WHAT THIS IS: 15,000 + mapillary_streets' 5,000 = 20,000/day
# on one IP, ~1.9x the only daily figure we have ever measured going badly. If
# the trigger turns out to be volume after all, this is the line that caused it.
# Also watch the third axis: a budget-sized catch-up is ~4 h of UNINTERRUPTED
# fetching where the 2026-08-12 block took ~29 min at ~370/min, so if a block
# arrives on a night that never exceeded 60/min, record BOTH the day's api_usage
# AND how long the fetching ran before changing anything.
#
# 2026-08-22 (issue #241): that bet LOST. Blocked again 2026-08-20 while
# obeying 60/min exactly, at a combined per-IP day spend of 5,013 -- while
# 08-19 ran 5,753 clean, so a same-day cap is arithmetically impossible and
# only a rolling 2-3 day accumulation window fits both blocks (2-day
# threshold somewhere in (7,061, 10,766]). Budgets are cut so the combined
# 2-day sum can never exceed 7,000, the highest value ever observed clean:
# 1,750 here + 1,750 on mapillary_streets = 3,500/day, split EVENLY because
# both channels read the identical z14 census. SINCE #290 THE WALK NO LONGER
# RE-READS THOSE TILES: it reuses the grid run's census for 0 requests on a
# paired night, so mapillary_streets' budget is spent only on nights the two
# are NOT paired. The values are unchanged — re-sizing them for the lighter
# load is #286's question. The even split still matters for the un-paired
# case, where the two budgets deplete in lockstep and a heavy slate defers the
# same cities on both channels instead of un-pairing them further. A
# normal 20-city night (~1,150 tiles per channel) fits; a catch-up-scale
# burst is impossible by construction, ON PURPOSE -- no `--limit` catch-ups until a rolling
# multi-day guard exists (#241). Recovery recipe, measured twice: full
# silence, then one single-request probe; both blocks cleared within ~a day
# of the last refused request.
daily_request_budget = 1750
# Client-side tile pacing (issue #198). Shared per-IP with mapillary_streets
# below and with any manual run on this host — the host lock (#208) is what
# makes this figure the real one rather than a per-process wish.
#
# 40 and JITTERED, not a metronomic 60 (issue #292, the fourth hypothesis):
# block 2 came with this limiter pinned at 60 and block 3 at 1,938/day while
# 26,363 had run clean in a day, so rate and volume are both falsified. The
# one thing every restart left unchanged was the exact 1.000 s cadence of a
# saturated token bucket.
#
# `jitter` draws each gap from a SHIFTED EXPONENTIAL: a floor of (1 - jitter)
# x the mean plus an exponential tail scaled to jitter. Here: 0.60 s floor,
# 1.50 s mean, ~4.7 s p99, no ceiling. It is also the gaps' coefficient of
# variation — an organic client's Poisson arrivals sit at 1.0, and the uniform
# draw this started as reached only 0.35 with a hard 2.4 s ceiling, which a
# scorer reading gap STATISTICS rather than gap EQUALITY would barely notice.
# Mean rate is unchanged in meaning, so budgets and the derived timeout need no
# re-sizing. 0 restores the exact cadence.
max_requests_per_minute = 40
jitter = 0.6

# Road-walk street-coverage collection (issue #99). SCHEDULED channels like the
# two above — same cycle, same stagger day (a city's grid and street snapshots
# pair), same failure counting — but `run-due` runs the road-walk collector for
# them instead of streetscape_tracker.py, against ISOLATED credentials and
# ledgers (GMAPS_STREETS_API_KEY / MAPILLARY_STREETS_ACCESS_TOKEN, metered under
# gsv_streets / mapillary_streets) so a road crawl can never exhaust the grid
# collectors' quota.
#
# GSV: one metadata request per on-street sample point, so the ceiling below is
# a nightly runtime knob rather than a cost limit (metadata is free). Paced by
# its own key's quota, NOT [download].max_requests_per_minute — the streets key
# is a fresh key at Google's ~30,000/min default, so 24,000 is ~80% headroom.
#
# Sizing: the whole frame is ~133M on-street samples at 15 m, so a full pass at
# 20 cities/night averages ~1.5M/night. The ceiling is 2x that because nightly
# demand is lumpy, not average — a single Berlin-scale city is ~850k, and three
# of them landing on one night would exhaust a tighter budget and defer the rest
# (graceful, but it stalls the first pass). The requests are free; only wall
# clock is spent, ~1 h/night at the pacing above.
[providers.gsv_streets]
enabled = true
daily_request_budget = 3000000
max_requests_per_minute = 24000
spacing_m = 15

# Mapillary road-walk: costs the z14 tile census — set by the frozen bbox's area
# (catalog median 12 tiles, mean 58, max 870) and independent of SPACING, though
# not of city size — because Mapillary has no per-point endpoint; the walk is a
# local spatial join against the tiles. Budgeted in tile
# requests against the SAME per-IP ceiling as [providers.mapillary] above, not
# against the per-app cap: different tokens, one address, so the number that
# matters is the SUM -- 1,750 + 1,750 = 3,500/day as of 2026-08-22; see the
# issue #241 note in [providers.mapillary]. Split evenly: a road walk reads
# the identical tile census as the grid run. Since #290 it REUSES that census
# rather than re-reading it, so on a paired night this channel spends nothing
# and this budget is drawn on only when the pair is split apart.
# PAUSED 2026-08-28 with [providers.mapillary] — same IP, same tile CDN, so
# pausing one and not the other would keep the host under exactly the load the
# pause exists to stop — and RESUMED with it 2026-08-30 under #292: the pair
# moves together in both directions.
[providers.mapillary_streets]
enabled = true
daily_request_budget = 1750
spacing_m = 15
# See [providers.mapillary] — one per-IP rate budget, two channels, and the
# same jitter, or the pattern under test would be half-changed (#292).
max_requests_per_minute = 40
jitter = 0.6

# KartaView (issue #248) — the one OPT-IN channel. Declaring this block enrolls
# NOBODY: the nightly queue is exactly the cities an operator ran
# `scheduler enroll-city CITY --channel kartaview` on, because a whole-catalog
# pass prices at ~186,000 requests ~= 186 h. Seed set on this host is Krabi and
# Yogyakarta. To see who is enrolled: `scheduler enroll-city --list`.
#
# daily_request_budget is a FLOOR to clear, NOT a ceiling on the night's spend
# (#273/#274): the guard is a pre-flight check against an ESTIMATE, and the child
# is handed no request cap, so a city that calibrates to r=500 can overspend this
# figure with only the per-city wall-clock timeout to stop it. 10,000 clears the
# largest city the cost study measured (Singapore, ~9,974); both seed cities are
# far under it. Widen only after #273 — and re-check this floor before enrolling
# any metro, since a city whose estimate exceeds it is skipped *permanently*.
#
# max_requests_per_minute is load-bearing beyond pacing: _kartaview_timeout_seconds
# derives every sweep's per-city timeout from this rate, so lowering it here
# silently shortens those timeouts too. 16/min = 960/h, under the 1,000/h
# authenticated ceiling. Requires KARTAVIEW_ACCESS_TOKEN in .env — anonymous is
# 100 req/h, which is not a slower channel, it is no channel.
#
# This is the FIFTH channel, so the effective max_concurrent_channels ceiling is
# 4 of 5 (kartaview.org is a per-IP host shared with nothing). Moot at the knob's
# current value of 1. See config/scheduler.toml for the full field docs.
[providers.kartaview]
enabled = true
daily_request_budget = 10000
max_requests_per_minute = 16

[download]
batch_size = 100
connection_limit = 50
request_timeout_s = 30.0
sleep_between_cities_s = 60
# Client-side GSV metadata rate cap. Google approved 60,000 req/min for this
# project (2026-07-16); we pace at 80% to stay clear of the quota alert and
# never write OVER_QUERY_LIMIT rows. Repo default is a conservative 24,000.
max_requests_per_minute = 48000

[paths]
# The checkout + data live on lab storage, NFS-mounted on the compute host.
# ~/streetscape-tracker is a convenience symlink to this path (see deploy/README.md).
data_dir = "/projects/makeabilitylab/streetscape-tracker/data"
db_path  = "/projects/makeabilitylab/streetscape-tracker/data/streetscape_tracker.db"
log_dir  = "/projects/makeabilitylab/streetscape-tracker/logs"
# Dated catalog backups (issue #145), retained 14 days. Stated explicitly like
# its neighbours rather than left to the default: the default resolves off the
# package location, which under the systemd unit reaches this same directory
# only by way of the ~/streetscape-tracker symlink. OUTSIDE data_dir (the
# publish rsync walks data/ and would ship catalog copies to the public web
# server) and INSIDE the tree CSE IT snapshots. Health: scheduler backup-status
backup_dir = "/projects/makeabilitylab/streetscape-tracker/backups"

[publish]
# After each successful nightly batch, publish *.csv.gz/*.json.gz to the public
# docroot. This host NFS-mounts the docroot, so publishing is a LOCAL rsync with
# no SSH hop. The script excludes the DB/logs/bare CSVs, so only sanitized
# artifacts ever reach the web server.
enabled = true
publish_script = "/projects/makeabilitylab/streetscape-tracker/sync_data_to_server.sh"
# local = true passes --local to the publish script. Declaring it HERE rather
# than relying on STREETSCAPE_PUBLISH_LOCAL=1 in the systemd unit is the point
# (issue #215): the unit exports that variable and an operator shell does not, so
# a hand-run `regenerate-aggregate --publish` or `assess-city` took the SSH path,
# failed with rsync code 12, and emailed a publish-FAILED alert that read as an
# outage. The unit still sets the env var too, harmlessly, so a rollback of the
# code cannot break nightly publishing.
local = true
# Public base URL, used only to print operator-facing links (assess-city).
site_url = "https://makeabilitylab.cs.washington.edu/public/streetscape-tracker/"

[alerts]
# Email on an unhealthy night (>= failure_threshold failed collections) or crash.
# transport = "smtp" (not "mail"): the local mailer is silently BLOCKED under
# the systemd sandbox — its setgid postdrop path trips NoNewPrivileges, so the
# alert never sends even though the failure is detected (#144). The stdlib
# smtplib path talks to the campus relay directly and works in the sandbox.
enabled = true
recipient = "jonf@cs.uw.edu"
transport = "smtp"
# Campus relay: reachable from makelab2, unauthenticated for on-campus hosts,
# plain port 25 (verified 2026-07-17). smtp_from MUST be a real deliverable
# address — the relay rejects streetscape-tracker@<hostname> as "Address
# unknown", so alerts appear to come from jonf@ (Reply-To not needed).
smtp_host = "smtp.cs.washington.edu"
smtp_port = 25
smtp_from = "jonf@cs.washington.edu"
failure_threshold = 1
subject_prefix = "[streetscape-tracker]"

[resource_guard]
# makelab1 is shared with other lab services. Before each city, back off this
# run's concurrency if the box is already under pressure (48 cores / 187 GB, so
# the load ceiling is ~43). Complements the static CPU/RAM caps in the systemd
# unit. See config/scheduler.toml for field docs.
enabled = true
min_available_memory_gb = 8.0
max_load_per_core = 0.9
min_connection_limit = 5

[driving_plan]
# Nightly snapshot of Google's published driving-plan feed (issue #176).
# Matches the manual snapshot dir already on prod; outside data/ so the
# publish rsync never sees it. See config/scheduler.toml for field docs.
enabled = true
archive_dir = "/projects/makeabilitylab/streetscape-tracker/archive/gsv_driving_plan"
