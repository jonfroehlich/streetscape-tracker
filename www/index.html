<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streetscape Tracker — City Explorer</title>

  <!-- Stylesheets (CDN assets carry SRI hashes: a compromised or tampered
       CDN response is refused by the browser rather than executed) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
        integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
        crossorigin="anonymous" />
  <link rel="stylesheet" href="css/streetscape-shared.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSQGNSTEES"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-ZSQGNSTEES");
  </script>

  <!-- Site header (shared markup with city.html / streets.html; styles live
       in streetscape-shared.css) -->
  <header class="site-header">
    <a class="site-brand" href="index.html">Streetscape Tracker</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page" title="World map of city imagery coverage">Map</a>
      <a href="grid.html" title="Per-city table of grid-sampling coverage: share of area sample points with imagery">Grid</a>
      <a href="streets.html" title="Per-city table of road-walk coverage: fraction of the street network driven">Streets</a>
      <a href="driving.html" title="Google's published driving plan compared against the imagery we have actually observed">GSV Driving</a>
    </nav>
    <a class="site-external" href="https://github.com/jonfroehlich/streetscape-tracker"
       target="_blank" rel="noopener">About &#8599;</a>
  </header>

  <!-- The options inside this group are rendered from the PROVIDERS registry
       by initProviderToggle() (index.js), not written here (issue #225): a
       hardcoded pair of radios leaves the group with NOTHING checked the day a
       third provider is registered, because ?provider= is validated against the
       registry and would select one no radio carries. The fieldset and its
       visually-hidden legend — the group's accessible name — stay in markup. -->
  <fieldset id="provider-toggle" class="provider-toggle"
            aria-label="Imagery provider">
    <legend class="visually-hidden">Imagery provider</legend>
  </fieldset>

  <fieldset id="metric-toggle" class="provider-toggle metric-toggle"
            aria-label="Color cities by">
    <legend class="visually-hidden">Color cities by</legend>
    <label>
      <input type="radio" name="metric" value="age" checked>
      <span title="Median age of each city's panoramas — bright yellow (new) through dark red (old)">Median age</span>
    </label>
    <label>
      <input type="radio" name="metric" value="coverage">
      <span title="Share of each city's grid sample points with a 360° panorama">Coverage</span>
    </label>
    <label>
      <input type="radio" name="metric" value="coverage_any">
      <span title="Each provider's full footprint, including flat/perspective imagery; equals Coverage for a provider that publishes 360° panoramas only, such as Google Street View">Any imagery</span>
    </label>
    <label>
      <input type="radio" name="metric" value="streets">
      <span title="Share of the city's OSM street network driven, from road-walk collection. Only available for cities that have been walked — see the Streets page.">Street coverage</span>
    </label>
    <label>
      <input type="radio" name="metric" value="freshness">
      <span title="How recently each city's data was collected — bright (just collected) through dark (stale)">Freshness</span>
    </label>
  </fieldset>

  <div id="city-search" class="city-search" role="search" aria-label="Search cities">
    <input id="city-search-input" type="text"
           placeholder="Search for a city…"
           autocomplete="off"
           aria-label="Search for a city"
           aria-controls="city-search-results"
           aria-autocomplete="list"
           role="combobox"
           aria-expanded="false" />
    <button id="city-search-reset" class="city-search-reset"
            type="button" aria-label="Reset map view" title="Reset map view">
      ✕
    </button>
    <ul id="city-search-results" class="city-search-results" role="listbox"></ul>
  </div>

  <div id="map" role="application" aria-label="World map of street-level imagery coverage"></div>

  <div id="loading" class="loading" role="status" aria-live="polite">
    Loading city data…
  </div>

  <div id="stats" aria-live="polite"></div>

  <!-- Right rail: legend on top, charts below, one fixed flex column — the
       two can never overlap, and collapsing the charts gives the legend the
       whole rail. The rail itself ignores pointer events so the map stays
       draggable in the empty space between the panels. -->
  <div id="right-rail">
    <div id="legend" class="legend" role="group" aria-label="Median age legend"></div>

    <div class="chart-container" aria-label="Scatter-plot charts">
      <div id="chart-drawer-head">
        <span id="chart-drawer-title">City scatter plots</span>
        <button type="button" id="chart-drawer-toggle" aria-expanded="true"
                aria-controls="chart-drawer-body" aria-label="Minimize charts"
                title="Minimize the scatter plots (gives the legend more room)">–</button>
      </div>
      <div id="chart-drawer-body">
        <div class="scatter-plot-container">
          <canvas id="panoScatter" role="img"
                  aria-label="Scatter plot of total panorama count versus median age for each city"></canvas>
        </div>
        <div class="scatter-plot-container">
          <canvas id="areaScatter" role="img"
                  aria-label="Scatter plot of city area versus median age for each city"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts (order matters: libs → shared utils → page logic) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
          integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"
          integrity="sha512-ZwR1/gSZM3ai6vCdI+LVF1zSq/5HznD3ZSTk7kajkaj4D292NLuduDCO1c/NT8Id+jE58KYLKT7hXnbtryGmMg=="
          crossorigin="anonymous"></script>
  <!-- Scatter-plot zoom/pan (wheel + pinch + drag; double-click resets).
       hammer.js supplies the touch gestures; the zoom plugin's UMD build
       self-registers with Chart.js, so load order is Chart.js → hammer →
       plugin. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"
          integrity="sha512-UXumZrZNiOwnTcZSHLOfcTs0aos2MzBWHXOHOuB0J/R44QB0dwY5JgfbvljXcklVf65Gc4El6RjZ+lnwd2az2g=="
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"
          integrity="sha512-wUYbRPLV5zs6IqvWd88HIqZU/b8TBx+I8LEioQ/UC0t5EMCLApqhIAnUg7EsAzdbhhdgW07TqYDdH3QEXRcPOQ=="
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"
          integrity="sha512-g2TeAWw5GPnX7z0Kn8nFbYfeHcvAu/tx6d6mrLe/90mkCxO+RcptyYpksUz35EO337F83bZwcmUyHiHamspkfg=="
          crossorigin="anonymous"></script>
  <script src="js/streetscape-utils.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
